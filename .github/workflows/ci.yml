name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - LICENSE
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - LICENSE

# A pull request's runs share one group, where a new run cancels the one in
# progress; each push to `main` has a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # The pinned pair, from `.tool-versions`: every gate but the harness,
          # which runs in `harness`.
          - name: pinned
            gleam: "1.19.0"
            erlang: "28.4.2"
            format: true
          # The oldest compiler graded is verified on — see
          # `graded/internal/compat`. It skips `gleam format --check`: formatter
          # output is not stable across Gleam minors, and a format diff on an old
          # compiler is not a defect.
          - name: floor
            gleam: "1.15.4"
            erlang: "28.4.2"
            format: false

    name: ${{ matrix.name }} (gleam ${{ matrix.gleam }}, erlang ${{ matrix.erlang }})

    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          gleam-version: ${{ matrix.gleam }}
          otp-version: ${{ matrix.erlang }}
          version-type: strict

      - name: Download dependencies
        run: gleam deps download

      - name: Check formatting
        if: matrix.format
        run: gleam format --check src/ test/

      - name: Build (warnings as errors)
        run: gleam build --warnings-as-errors

      - name: Run tests
        run: gleam test

      - name: Lint
        run: gleam run -m glinter

      - name: Public API names no internal type
        run: gleam run -m check_public_interface

  harness:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # One job per shard of `effect_validation`.
        shard: [1, 2, 3]

    name: harness ${{ matrix.shard }}/${{ strategy.job-total }} (pinned)

    steps:
      - uses: actions/checkout@v5

      # The pinned pair, read from `.tool-versions`.
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download dependencies
        run: gleam deps download

      - name: Answers contain what generated programs do
        run: gleam run -m effect_validation -- --seed 1 --cases 40 --shard ${{ matrix.shard }}/${{ strategy.job-total }}
